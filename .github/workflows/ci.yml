name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      # Static assets live in public/ and are only copied into dist/ at build
      # time. This has broken silently before, so assert it on every build.
      - name: Verify built assets
        run: |
          test -f dist/index.html
          test -f dist/favicon.svg
          test -f dist/assets/hero/glass.jpeg
          test -f dist/assets/products/placeholder.svg
          test -f dist/assets/categories/new.jpeg
          test -f dist/assets/concerns/sensitive.jpeg
          echo "Built asset count: $(find dist -type f | wc -l)"

      - name: Verify demo data is in sync with the seed migration
        run: |
          npm run gen:demo
          if ! git diff --quiet -- src/lib/demoData.ts; then
            echo "::error::src/lib/demoData.ts is out of date."
            echo "Run 'npm run gen:demo' and commit the result."
            git --no-pager diff --stat -- src/lib/demoData.ts
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
